name: Python tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m lansync --help
      - name: Optional desktop client tests
        if: matrix.python == '3.13'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -e ".[gui]"
          python -m unittest discover -s tests -p test_gui.py -v
      - run: python scripts/benchmark.py --counts 10 --repeats 1 --work-dir .benchmark-work --output benchmark-smoke.json
      - run: python -m pip install build
      - run: python scripts/release_check.py --output .release-check
      - name: Linux load-test harness smoke check
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python scripts/soak.py --cli "$(command -v lansync)" --output .soak-smoke --duration 2 --files 5 --large-mib 1
      - name: Linux process-crash recovery checks
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python scripts/crash_check.py run --output .crash-check
