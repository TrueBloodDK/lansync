# Copy this file into your demo directory. Paths are relative to this file.
command = "serve"
root = "./shared"
state_dir = "./server-state"
host = "0.0.0.0"
port = 8765
token_file = "./credentials/token.txt"
cert_file = "./credentials/server.pem"
key_file = "./credentials/server-key.pem"
allow_write = true
exclude = ["*.tmp", ".git"]
