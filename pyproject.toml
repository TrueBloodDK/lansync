[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lansync"
version = "0.1.0"
description = "Cross-platform LAN file synchronization: filesystem index"
requires-python = ">=3.11"
dependencies = ["watchdog>=6,<8", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
setup = ["trustme>=1.2,<2"]
dev = ["pytest>=8,<10", "trustme>=1.2,<2"]

[project.scripts]
lansync = "lansync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
