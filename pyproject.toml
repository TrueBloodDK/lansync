[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lansync"
version = "0.1.0"
description = "Cross-platform LAN file synchronization: filesystem index"
requires-python = ">=3.11"
dependencies = ["watchdog>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lansync = "lansync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
