[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lansync"
dynamic = ["version"]
description = "Cross-platform LAN file synchronization with manifests, conflicts and recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["watchdog>=6,<8", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
setup = ["trustme>=1.2,<2"]
dev = ["pytest>=8,<10", "trustme>=1.2,<2"]
gui = ["PySide6>=6.8,<7"]
packaging = ["PySide6>=6.8,<7", "pyinstaller>=6,<7"]

[project.scripts]
lansync = "lansync.cli:main"

[project.gui-scripts]
lansync-gui = "lansync.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "lansync.__version__"}
